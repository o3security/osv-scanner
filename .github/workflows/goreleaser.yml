name: Release (latest)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions: {}

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version: stable
          check-latest: true

      - name: Build with GoReleaser (snapshot)
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete existing 'latest' release
        run: gh release delete latest --yes --cleanup-tag 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create 'latest' release
        # Publish one asset per architecture, named the way upstream names them,
        # so a client can resolve its own binary as osv-scanner_linux_<arch>.
        #
        # With `formats: binary` goreleaser does not emit a separate archive
        # file — the built binary stays at dist/<id>_<target>/osv-scanner, where
        # <target> carries a microarchitecture suffix (_v1, _v8.0). Uploading
        # that path directly published a single asset called plain
        # "osv-scanner": no architecture in the name, and nowhere to put a
        # second one. gh's `path#name` syntax sets the asset name explicitly,
        # which keeps the naming stable even if the suffix changes.
        run: |
          gh release create latest \
            "dist/osv-scanner_linux_amd64_v1/osv-scanner#osv-scanner_linux_amd64" \
            "dist/osv-scanner_linux_arm64_v8.0/osv-scanner#osv-scanner_linux_arm64" \
            dist/osv-scanner_SHA256SUMS \
            --title "Latest Build" \
            --notes "Automated build from main branch ($(date -u +'%Y-%m-%d %H:%M UTC')). Commit: ${{ github.sha }}" \
            --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
