name: Release (latest)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions: {}

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version: stable
          check-latest: true

      - name: Build with GoReleaser (snapshot)
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # NOTE: deleting `latest` is deliberately NOT a separate step. When the
      # delete succeeded and the upload then failed, the repo was left with no
      # `latest` release at all (a 404 for every consumer) until someone
      # re-ran the build. Deletion now happens in the publish step below, after
      # the assets are staged and verified, so a failure leaves the previous
      # release intact.

      - name: Create 'latest' release
        # Publish one asset per architecture, named the way upstream names them,
        # so a client can resolve its own binary as osv-scanner_linux_<arch>.
        #
        # With `formats: binary` goreleaser does not emit a separate archive
        # file — the built binary stays at dist/<id>_<target>/osv-scanner, where
        # <target> carries a microarchitecture suffix (_v1, _v8.0). Uploading
        # that path directly published a single asset called plain
        # "osv-scanner": no architecture in the name, and nowhere to put a
        # second one.
        #
        # gh names an asset after its FILENAME — `path#label` sets the display
        # label, not the name, so uploading two files both called "osv-scanner"
        # collides on the second one. Stage them under the names we want first.
        # Globbing the microarchitecture suffix (_v1, _v8.0) keeps this working
        # if goreleaser changes it.
        run: |
          set -euo pipefail
          mkdir -p release
          cp dist/osv-scanner_linux_amd64_v*/osv-scanner release/osv-scanner_linux_amd64
          cp dist/osv-scanner_linux_arm64_v*/osv-scanner release/osv-scanner_linux_arm64
          cp dist/osv-scanner_SHA256SUMS release/osv-scanner_SHA256SUMS

          # Fail before touching the published release if a build went missing —
          # `cp` of a glob that matched nothing, a renamed target, an empty file.
          for f in release/osv-scanner_linux_amd64 release/osv-scanner_linux_arm64; do
            test -s "$f" || { echo "::error::missing or empty artifact: $f"; exit 1; }
          done
          ls -l release/

          # Only now replace the existing release. `--cleanup-tag` drops the tag
          # too, so the create below re-points it at this commit.
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true

          gh release create latest \
            release/osv-scanner_linux_amd64 \
            release/osv-scanner_linux_arm64 \
            release/osv-scanner_SHA256SUMS \
            --title "Latest Build" \
            --notes "Automated build from main branch ($(date -u +'%Y-%m-%d %H:%M UTC')). Commit: ${{ github.sha }}" \
            --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
